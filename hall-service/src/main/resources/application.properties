spring.application.name=hall-service
server.port=8087
spring.datasource.url=jdbc:mysql://localhost:3306/hall_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Observability (Actuator + tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# --- Config client + live refresh ---
spring.config.import=optional:configserver:http://localhost:8888
