spring.application.name=booking-service
spring.datasource.url=jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- server ---
server.port=8082

# --- Resilience4j circuit breaker (instance: hallService) ---
resilience4j.circuitbreaker.instances.hallService.sliding-window-size=10
resilience4j.circuitbreaker.instances.hallService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.hallService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.hallService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.hallService.register-health-indicator=true

# --- Feign timeouts ---
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# --- Observability (Actuator + tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,retries,ratelimiters
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# --- Resilience4j Retry (instance: hallService) ---
resilience4j.retry.instances.hallService.max-attempts=3
resilience4j.retry.instances.hallService.wait-duration=1s
resilience4j.retry.instances.hallService.retry-exceptions=feign.FeignException,java.io.IOException,java.util.concurrent.TimeoutException

# --- Resilience4j RateLimiter (instance: hallService) ---
resilience4j.ratelimiter.instances.hallService.limit-for-period=5
resilience4j.ratelimiter.instances.hallService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.hallService.timeout-duration=0s
