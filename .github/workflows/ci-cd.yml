# ==========================================================================
#  CI/CD Pipeline - Marriage Hall Microservices
#  Job 1: har service ko build + test (matrix)
#  Job 2: main branch par -> Docker image build + push to GHCR
# ==========================================================================
name: CI-CD Pipeline

# ---------------- WHEN does this run? ----------------
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ======================================================================
  #  JOB 1 : BUILD + TEST  (runs for every service in parallel)
  # ======================================================================
  build-and-test:
    runs-on: ubuntu-latest

    # MySQL service container -> @SpringBootTest context load ke liye DB chahiye
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marriagehall
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Matrix = same steps 6 services ke liye parallel chalenge
    strategy:
      fail-fast: false        # ek service fail ho -> baaki phir bhi chalein
      matrix:
        include:
          - { name: discovery-server, path: discovery-server }
          - { name: config-server,   path: config-server }
          - { name: api-gateway,      path: api-gateway }
          - { name: auth-service,     path: auth-service }
          - { name: hall-service,     path: hall-service }
          - { name: booking-service,  path: booking-service }
          - { name: review-service,   path: review-service }
          - { name: notification-service, path: notification-service }

    name: build (${{ matrix.name }})

    steps:
      # 1. repo ka code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 + Maven dependency cache
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. build + run tests
      - name: Build & Test
        working-directory: ${{ matrix.path }}
        env:
          # tests ko DB chahiye -> CI ke MySQL service container par point karo
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/marriagehall?createDatabaseIfNotExist=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          # CI me Eureka nahi chal rahi -> client disable warna warnings/wait
          EUREKA_CLIENT_ENABLED: "false"
        run: mvn -B clean verify

  # ======================================================================
  #  JOB 2 : DOCKER BUILD + PUSH  (sirf main branch par)
  # ======================================================================
  docker-build-push:
    needs: build-and-test            # tests pass hone ke BAAD hi
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write                # GHCR par push karne ke liye

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: discovery-server, path: discovery-server }
          - { name: config-server,   path: config-server }
          - { name: api-gateway,      path: api-gateway }
          - { name: auth-service,     path: auth-service }
          - { name: hall-service,     path: hall-service }
          - { name: booking-service,  path: booking-service }
          - { name: review-service,   path: review-service }
          - { name: notification-service, path: notification-service }

    name: docker (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR requires lowercase -> owner/repo ko lowercase me convert
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # GitHub Container Registry me login (built-in token, koi secret setup nahi)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # build + push -> 2 tags: :latest aur :<commit-sha>
      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
