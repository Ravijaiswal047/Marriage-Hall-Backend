spring.application.name=auth-service
server.port=9090
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# --- Spring Cloud Config Server ---
# optional: -> config server down ho to bhi app start ho (local fallback)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey123}

# --- Observability (Actuator + tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
